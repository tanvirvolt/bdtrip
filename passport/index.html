<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Trip — ভ্রমণ পাসপোর্ট</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0b6b4a;--green-d:#08523a;--green-l:#e9f4ee;--coral:#e8503a;--amber:#f2a63b;--bg:#faf8f3;--ink:#14201b;--mut:#6b7a72;--line:#e8e4d8;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.top{max-width:1100px;margin:0 auto;padding:16px 16px 0;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;text-decoration:none;color:var(--ink)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;letter-spacing:.5px}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-weight:600;font-size:13px}
.lang:hover{border-color:var(--green);color:var(--green)}
.hero{text-align:center;padding:30px 16px 22px;max-width:760px;margin:0 auto}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:16px}
.pill i{width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 4px #2ecc7133}
h1{font-size:clamp(34px,7vw,56px);line-height:1.15;font-weight:700;letter-spacing:-.5px}
h1 em{font-style:normal;-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .g{background-image:linear-gradient(90deg,#0b6b4a,#2aa56f)}
h1 .o{background-image:linear-gradient(90deg,#f2a63b,#e8503a)}
.hero p{color:var(--mut);margin-top:12px;font-size:15px}
.wrap{max-width:1100px;margin:0 auto;padding:6px 16px 40px;display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.tabs{display:inline-flex;background:#f0ede3;border-radius:999px;padding:4px;margin-bottom:14px}
.tabs button{padding:6px 18px;border-radius:999px;font-weight:600;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--ink);color:#fff}
.fields{display:grid;grid-template-columns:1fr auto;gap:14px;margin-bottom:14px}
@media(max-width:560px){.fields{grid-template-columns:1fr}}
label.l{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:#fcfbf7;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;outline:0}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px #0b6b4a1f}
.covers{display:flex;gap:8px}
.cv{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.cv span{width:14px;height:20px;border-radius:3px;border:1px solid #0003}
.cv.on{border-color:var(--ink);box-shadow:0 0 0 3px #14201b14}
.stage{background:linear-gradient(180deg,#eef6f1,#f7f5ec);border-radius:14px;padding:14px 14px 18px;overflow:hidden}
.sbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mini{display:flex;align-items:center;gap:8px;font-weight:700}
.mini b{background:var(--green);color:#fff;border-radius:8px;width:28px;height:28px;display:grid;place-items:center;font-size:11px}
.badge{background:var(--green);color:#fff;font-weight:700;font-size:12px;padding:3px 12px;border-radius:999px}
#cv{display:block;width:100%;height:auto;margin:0 auto;filter:drop-shadow(0 16px 20px #0b2a1e40)}
.stage.cover #cv{max-width:340px}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.head h2{font-size:15px;font-weight:700;flex:1}
.cnt{background:var(--green-l);color:var(--green);font-weight:700;font-size:12px;padding:2px 10px;border-radius:999px}
.q{display:flex;justify-content:flex-end;gap:12px;font-size:12px;margin-bottom:10px}
.q button{text-decoration:underline;color:var(--mut)}
.q button:hover{color:var(--green)}
.list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.place{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:7px 9px;transition:.15s}
.place:hover{border-color:#b9d5c7}
.place .ck{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid #c8c3b3;display:grid;place-items:center;color:#fff;font-size:11px;font-style:normal}
.place b{display:block;font-size:13.5px;font-weight:600;line-height:1.25}
.place small{display:block;font-size:11px;color:var(--mut);line-height:1.2}
.place.on{background:var(--green-l);border-color:var(--green)}
.place.on .ck{background:var(--green);border-color:var(--green)}
.place.on .ck::after{content:"✓"}
.bar{height:7px;background:#eee9da;border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#2aa56f);transition:width .3s}
.lv{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.lv b{color:var(--green)}
aside{display:grid;gap:14px}
.btn{display:block;width:100%;text-align:center;padding:12px;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;transition:.15s}
.btn.p{background:var(--green);color:#fff}
.btn.p:hover{background:var(--green-d)}
.btn.s{border:1.5px solid var(--line);background:#fff;margin-top:8px}
.btn.s:hover{border-color:var(--green);color:var(--green)}
.btn[disabled]{opacity:.5;pointer-events:none}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 16px 30px}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#"><span class="logo">BD</span>BD Trip</a>
  <button class="lang" id="lang" type="button">English</button>
</header>

<section class="hero">
  <span class="pill"><i></i><span data-i18n="pill"></span></span>
  <h1><span data-i18n="h1a"></span> <em class="g" data-i18n="h1b"></em> <em class="o" data-i18n="h1c"></em></h1>
  <p data-i18n="sub"></p>
</section>

<main class="wrap">
  <section class="card">
    <div class="tabs">
      <button type="button" data-tab="inner" class="on" data-i18n="tabStamps"></button>
      <button type="button" data-tab="cover" data-i18n="tabCover"></button>
    </div>
    <div class="fields">
      <div>
        <label class="l" for="name" data-i18n="nameL"></label>
        <input class="inp" id="name" maxlength="24" autocomplete="off" data-i18n-ph="namePh">
      </div>
      <div>
        <label class="l" data-i18n="coverL"></label>
        <div class="covers" id="covers"></div>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="sbar"><span class="mini"><b>BD</b>BD Trip</span><span class="badge" id="badge"></span></div>
      <canvas id="cv"></canvas>
    </div>
    <p class="note" data-i18n="note"></p>
  </section>

  <aside>
    <section class="card">
      <div class="head"><h2 data-i18n="placesT"></h2><span class="cnt" id="cnt"></span></div>
      <div class="q"><button type="button" id="all" data-i18n="all"></button><button type="button" id="none" data-i18n="none"></button></div>
      <div class="list" id="list"></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="lv"><span id="lvl"></span><span id="left"></span></div>
    </section>
    <section class="card">
      <button class="btn p" id="dl" type="button" data-i18n="dl"></button>
      <button class="btn s" id="share" type="button" data-i18n="share" hidden></button>
      <a class="btn s" id="plan" href="#planner" data-i18n="plan"></a>
    </section>
  </aside>
</main>
<footer data-i18n="foot"></footer>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const GOLD = '#e8c874', GREEN = '#0b6b4a';

  /* ---------- data ---------- */
  const COLORS = ['#c0392b', '#1f4e9c', '#0e7a4f', '#7b3fa0', '#b9570f'];
  const SHAPES = ['circle', 'rect', 'oval', 'hex'];
  const PLACES = [
    ['cox','কক্সবাজার',"Cox's Bazar",'কক্সবাজার',"Cox's Bazar"],
    ['stm','সেন্টমার্টিন','Saint Martin','কক্সবাজার',"Cox's Bazar"],
    ['sajek','সাজেক ভ্যালি','Sajek Valley','রাঙামাটি','Rangamati'],
    ['rat','রাতারগুল','Ratargul','সিলেট','Sylhet'],
    ['jaf','জাফলং','Jaflong','সিলেট','Sylhet'],
    ['sun','সুন্দরবন','Sundarbans','খুলনা','Khulna'],
    ['kua','কুয়াকাটা','Kuakata','পটুয়াখালী','Patuakhali'],
    ['nil','নীলগিরি','Nilgiri','বান্দরবান','Bandarban'],
    ['srm','শ্রীমঙ্গল','Sreemangal','মৌলভীবাজার','Moulvibazar'],
    ['tan','টাঙ্গুয়ার হাওর','Tanguar Haor','সুনামগঞ্জ','Sunamganj'],
    ['kap','কাপ্তাই লেক','Kaptai Lake','রাঙামাটি','Rangamati'],
    ['bic','বিছনাকান্দি','Bichanakandi','সিলেট','Sylhet'],
    ['naf','নাফাখুম','Nafakhum','বান্দরবান','Bandarban'],
    ['sat','ষাট গম্বুজ মসজিদ','Sixty Dome Mosque','বাগেরহাট','Bagerhat'],
    ['pah','পাহাড়পুর','Paharpur','নওগাঁ','Naogaon'],
    ['mah','মহাস্থানগড়','Mahasthangarh','বগুড়া','Bogura'],
    ['lal','লালবাগ কেল্লা','Lalbagh Fort','ঢাকা','Dhaka'],
    ['pan','পানাম নগর','Panam Nagar','নারায়ণগঞ্জ','Narayanganj'],
    ['ahs','আহসান মঞ্জিল','Ahsan Manzil','ঢাকা','Dhaka'],
    ['nij','নিঝুম দ্বীপ','Nijhum Dwip','নোয়াখালী','Noakhali']
  ].map(([id, bn, en, dbn, den], i) => ({ id, bn, en, dbn, den, c: COLORS[i % 5], s: SHAPES[(i * 3 + 1) % 4] }));
  const TOTAL = PLACES.length;

  const COVERS = {
    green:  { c: '#0b6b4a', bn: 'সবুজ', en: 'Green' },
    blue:   { c: '#1c3f7a', bn: 'নীল', en: 'Blue' },
    maroon: { c: '#7a1f2e', bn: 'মেরুন', en: 'Maroon' },
    black:  { c: '#1f2629', bn: 'কালো', en: 'Black' }
  };

  const LEVELS = [
    [0,  'নতুন যাত্রী', 'Newcomer'],
    [1,  'ভ্রমণ শুরু', 'First Steps'],
    [5,  'ঘুরকুটে', 'Wanderer'],
    [10, 'অ্যাডভেঞ্চারার', 'Adventurer'],
    [15, 'ট্রাভেল গুরু', 'Travel Guru'],
    [20, 'বাংলাদেশ জয়ী', 'Bangladesh Master']
  ];

  const T = {
    bn: {
      pill: 'ফ্রি ট্রাভেল পাসপোর্ট জেনারেটর', h1a: 'আপনার', h1b: 'ভ্রমণ', h1c: 'পাসপোর্ট',
      sub: 'যেসব জায়গায় ঘুরেছেন সেগুলো বেছে নিন। প্রতিটি জায়গার নিজস্ব সিল বসবে আপনার পাসপোর্টে। নাম লিখুন, কভার বেছে নিন আর ডাউনলোড করুন।',
      tabStamps: 'সিলের পাতা', tabCover: 'কভার', nameL: 'আপনার নাম', namePh: 'নাম লিখুন (ঐচ্ছিক)', coverL: 'পাসপোর্টের কভার',
      note: 'তালিকা থেকে জায়গা বাছলেই সিল বসবে।', placesT: 'যেসব জায়গায় গিয়েছি', all: 'সব বাছাই', none: 'সব মুছুন',
      dl: '↓ আমার পাসপোর্ট ডাউনলোড করুন', share: 'বন্ধুদের সাথে শেয়ার করুন', plan: 'পরের ট্রিপ প্ল্যান করুন →',
      foot: 'BD Trip · বাংলাদেশ ঘুরে দেখুন', place: 'জায়গা', left: n => n ? `আর ${n}টি বাকি` : 'সবগুলো ঘোরা শেষ! 🎉', lvl: 'লেভেল'
    },
    en: {
      pill: 'Free travel passport generator', h1a: 'Your', h1b: 'Travel', h1c: 'Passport',
      sub: 'Pick the places you have been to. Each one gets its own stamp in your passport. Add your name, choose a cover and download it.',
      tabStamps: 'Stamp page', tabCover: 'Cover', nameL: 'Your name', namePh: 'Enter your name (optional)', coverL: 'Passport cover',
      note: 'Choose places from the list to add stamps.', placesT: 'Places I have visited', all: 'Select all', none: 'Clear all',
      dl: '↓ Download my passport', share: 'Share with friends', plan: 'Plan your next trip →',
      foot: 'BD Trip · Explore Bangladesh', place: 'places', left: n => n ? `${n} to go` : 'You did them all! 🎉', lvl: 'Level'
    }
  };

  /* ---------- state ---------- */
  let S = { lang: 'bn', name: '', cover: 'green', tab: 'inner', sel: [] };
  try { Object.assign(S, JSON.parse(localStorage.getItem('bdtrip-passport') || '{}')); } catch (e) {}
  if (!COVERS[S.cover]) S.cover = 'green';
  if (!Array.isArray(S.sel)) S.sel = [];
  const save = () => { try { localStorage.setItem('bdtrip-passport', JSON.stringify(S)); } catch (e) {} };

  const bnDigits = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  const num = n => S.lang === 'bn' ? bnDigits(n) : String(n);
  const pname = p => S.lang === 'bn' ? p.bn : p.en;
  const levelOf = n => { let r = LEVELS[0]; LEVELS.forEach(l => { if (n >= l[0]) r = l; }); return r; };
  const today = () => {
    const d = new Date(), p = v => String(v).padStart(2, '0');
    return num(`${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`);
  };
  const hash = str => { let h = 7; for (const ch of str) h = (h * 31 + ch.codePointAt(0)) % 900000; return h + 100000; };

  /* ---------- canvas helpers ---------- */
  const FONT = '"Hind Siliguri",sans-serif';
  function rr(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function fit(c, text, weight, max, size, min = 8) {
    let s = size;
    do { c.font = `${weight} ${s}px ${FONT}`; if (c.measureText(text).width <= max) break; s -= .5; } while (s > min);
    return s;
  }
  const spacing = (c, v) => { if ('letterSpacing' in c) c.letterSpacing = v; };

  /* ---------- cover (560 x 780) ---------- */
  function drawCover(c) {
    const col = COVERS[S.cover].c;
    c.save();
    rr(c, 0, 0, 560, 780, 28); c.fillStyle = col; c.fill();
    c.clip();
    const g = c.createLinearGradient(0, 0, 560, 780);
    g.addColorStop(0, 'rgba(255,255,255,.14)'); g.addColorStop(1, 'rgba(0,0,0,.22)');
    c.fillStyle = g; c.fillRect(0, 0, 560, 780);
    c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 1;
    for (let i = -780; i < 560; i += 9) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i + 780, 780); c.stroke(); }
    c.restore();

    c.save();
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.strokeStyle = GOLD; c.globalAlpha = .6; c.lineWidth = 2; rr(c, 24, 24, 512, 732, 18); c.stroke(); c.globalAlpha = 1;
    c.fillStyle = GOLD;
    c.font = `700 44px ${FONT}`; c.fillText('ভ্রমণ পাসপোর্ট', 280, 112);
    c.font = `600 17px ${FONT}`; spacing(c, '6px'); c.fillText('TRAVEL PASSPORT', 280, 160); spacing(c, '0px');

    // compass emblem
    const cx = 280, cy = 380;
    c.strokeStyle = GOLD; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, 112, 0, 7); c.stroke();
    c.lineWidth = 1.2; c.beginPath(); c.arc(cx, cy, 102, 0, 7); c.stroke();
    for (let i = 0; i < 48; i++) {
      const a = i / 48 * Math.PI * 2, r1 = 114, r2 = i % 4 === 0 ? 128 : 122;
      c.beginPath(); c.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); c.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); c.stroke();
    }
    c.beginPath();
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2 - Math.PI / 2, r = i % 2 === 0 ? (i % 4 === 0 ? 84 : 58) : 20;
      c[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    c.closePath(); c.fill();
    c.fillStyle = col; c.beginPath(); c.arc(cx, cy, 10, 0, 7); c.fill();
    c.fillStyle = GOLD; c.beginPath(); c.arc(cx, cy, 5, 0, 7); c.fill();

    c.font = `700 34px ${FONT}`; spacing(c, '8px'); c.fillText('BD TRIP', 280, 570); spacing(c, '0px');
    const nm = S.name.trim();
    c.globalAlpha = nm ? 1 : .45;
    fit(c, nm || (S.lang === 'bn' ? 'আপনার নাম' : 'YOUR NAME'), 700, 430, 34);
    c.fillText(nm || (S.lang === 'bn' ? 'আপনার নাম' : 'YOUR NAME'), 280, 650);
    c.globalAlpha = .8; c.font = `500 15px ${FONT}`;
    c.fillText(`${num(S.sel.length)}/${num(TOTAL)} ${T[S.lang].place}`, 280, 706);
    c.restore();
  }

  /* ---------- stamps ---------- */
  function poly(c, r, n) {
    c.beginPath();
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 - Math.PI / 2; c[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
    c.closePath();
  }
  function stamp(c, cx, cy, p, i, date) {
    const rot = (((i * 29) % 31) - 15) * Math.PI / 180;
    c.save();
    c.translate(cx, cy); c.rotate(rot);
    c.globalCompositeOperation = 'multiply'; c.globalAlpha = .88;
    c.strokeStyle = c.fillStyle = p.c;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    let ty = -22, dy = 23;
    if (p.s === 'circle') {
      c.lineWidth = 2.6; c.beginPath(); c.arc(0, 0, 44, 0, 7); c.stroke();
      c.lineWidth = 1; c.beginPath(); c.arc(0, 0, 39, 0, 7); c.stroke();
    } else if (p.s === 'rect') {
      c.lineWidth = 2.6; rr(c, -46, -34, 92, 68, 6); c.stroke();
      c.lineWidth = 1; rr(c, -42, -30, 84, 60, 3); c.stroke();
      ty = -21; dy = 21;
    } else if (p.s === 'oval') {
      c.lineWidth = 2.6; c.beginPath(); c.ellipse(0, 0, 46, 34, 0, 0, 7); c.stroke();
      c.lineWidth = 1; c.beginPath(); c.ellipse(0, 0, 41, 29, 0, 0, 7); c.stroke();
      ty = -17; dy = 19;
    } else {
      c.lineWidth = 2.6; poly(c, 44, 6); c.stroke();
      c.lineWidth = 1; poly(c, 39, 6); c.stroke();
      ty = -20; dy = 21;
    }
    spacing(c, '1.5px'); c.font = `600 7.5px ${FONT}`; c.fillText('BD TRIP', 0, ty); spacing(c, '0px');
    fit(c, p.bn, 700, 62, 15, 8); c.fillText(p.bn, 0, -3);
    const en = p.en.toUpperCase();
    fit(c, en, 600, 60, 8, 5); c.fillText(en, 0, 11);
    c.font = `600 7.5px ${FONT}`; c.fillText(date, 0, dy);
    c.restore();
  }

  /* ---------- inner page (1000 x 640) ---------- */
  function drawInner(c) {
    const n = S.sel.length, lv = levelOf(n), date = today();
    c.save();
    rr(c, 0, 0, 1000, 640, 22);
    const bg = c.createLinearGradient(0, 0, 1000, 640);
    bg.addColorStop(0, '#f8f3e0'); bg.addColorStop(1, '#efe8cf');
    c.fillStyle = bg; c.fill(); c.clip();

    // guilloche-style background
    c.strokeStyle = GREEN; c.globalAlpha = .06; c.lineWidth = 1;
    for (let r = 60; r < 420; r += 12) { c.beginPath(); c.ellipse(500, 320, r * 1.5, r, 0, 0, 7); c.stroke(); }
    for (let k = 0; k < 6; k++) {
      c.beginPath();
      for (let x = 0; x <= 1000; x += 8) { const y = 320 + Math.sin(x / 70 + k) * (70 + k * 18); c[x ? 'lineTo' : 'moveTo'](x, y); }
      c.stroke();
    }
    c.globalAlpha = 1;
    const fold = c.createLinearGradient(470, 0, 530, 0);
    fold.addColorStop(0, 'rgba(0,0,0,0)'); fold.addColorStop(.5, 'rgba(60,50,20,.12)'); fold.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = fold; c.fillRect(470, 0, 60, 640);
    c.restore();

    c.save();
    c.strokeStyle = GREEN; c.lineWidth = 2.5; c.globalAlpha = .85; rr(c, 10, 10, 980, 620, 16); c.stroke();
    c.lineWidth = 1; c.globalAlpha = .5; rr(c, 16, 16, 968, 608, 12); c.stroke(); c.globalAlpha = 1;
    c.textBaseline = 'middle'; c.textAlign = 'left';

    // headers
    c.fillStyle = GREEN; c.font = `700 15px ${FONT}`; c.fillText('ভ্রমণ পাসপোর্ট · TRAVEL PASSPORT', 40, 46);
    c.textAlign = 'right'; spacing(c, '2px'); c.fillText('BD TRIP', 960, 46); spacing(c, '0px'); c.textAlign = 'left';

    // photo box
    rr(c, 40, 86, 150, 190, 12); c.fillStyle = 'rgba(11,107,74,.1)'; c.fill();
    c.strokeStyle = GREEN; c.globalAlpha = .4; c.lineWidth = 1.5; c.stroke(); c.globalAlpha = 1;
    c.fillStyle = GREEN; c.globalAlpha = .75;
    c.beginPath(); c.arc(115, 160, 30, Math.PI * 0.82, Math.PI * 2.18); c.lineTo(115, 215); c.closePath(); c.fill();
    c.globalAlpha = 1; c.fillStyle = '#f4efdc'; c.beginPath(); c.arc(115, 158, 11, 0, 7); c.fill();
    c.fillStyle = GREEN; c.globalAlpha = .6; c.font = `700 12px ${FONT}`; c.textAlign = 'center'; c.fillText('BANGLADESH', 115, 250); c.textAlign = 'left'; c.globalAlpha = 1;

    // info fields
    const lab = (t, x, y) => { c.fillStyle = '#7a8a80'; c.font = `500 11px ${FONT}`; c.fillText(t, x, y); };
    const val = (t, x, y, max, size, ph) => { c.fillStyle = ph ? '#9aa59f' : '#14201b'; fit(c, t, 700, max, size); c.fillText(t, x, y); };
    const nm = S.name.trim();
    lab('নাম / NAME', 215, 100); val(nm || (S.lang === 'bn' ? 'আপনার নাম' : 'YOUR NAME'), 215, 126, 245, 26, !nm);
    const pno = 'BT' + hash(nm || 'traveller');
    lab('পাসপোর্ট নং / PASSPORT NO.', 215, 170); c.fillStyle = '#14201b'; c.font = `700 21px ${FONT}`; spacing(c, '1px'); c.fillText(pno, 215, 196); spacing(c, '0px');
    lab('ইস্যু / ISSUED', 215, 240); val(date, 215, 262, 130, 18);
    lab('সিল / STAMPS', 355, 240); val(`${num(n)}/${num(TOTAL)}`, 355, 262, 100, 18);

    // level
    rr(c, 40, 306, 420, 124, 14); c.fillStyle = 'rgba(11,107,74,.08)'; c.fill();
    lab('ভ্রমণ লেভেল / TRAVEL LEVEL', 60, 332);
    c.fillStyle = GREEN; c.font = `700 30px ${FONT}`; c.fillText(S.lang === 'bn' ? lv[1] : lv[2], 60, 370);
    rr(c, 60, 400, 380, 10, 5); c.fillStyle = 'rgba(11,107,74,.15)'; c.fill();
    if (n) { rr(c, 60, 400, Math.max(10, 380 * n / TOTAL), 10, 5); c.fillStyle = GREEN; c.fill(); }

    // machine readable zone
    rr(c, 30, 470, 440, 96, 8); c.fillStyle = 'rgba(255,255,255,.6)'; c.fill();
    const latin = (nm.toUpperCase().replace(/[^A-Z ]/g, '').trim().replace(/ +/g, '<')) || 'TRAVELLER';
    const l1 = ('P<BGD' + latin).padEnd(34, '<').slice(0, 34);
    const l2 = (pno + '<BGD' + String(n).padStart(2, '0') + 'TRIP').padEnd(34, '<').slice(0, 34);
    c.fillStyle = '#26332d'; c.font = '600 18px "Courier New",monospace'; spacing(c, '1px');
    c.fillText(l1, 44, 500); c.fillText(l2, 44, 536); spacing(c, '0px');

    // right page: stamps
    c.fillStyle = GREEN; c.font = `700 12px ${FONT}`; spacing(c, '1px'); c.fillText('ভ্রমণ সিল / VISAS & STAMPS', 520, 92); spacing(c, '0px');
    for (let i = 0; i < TOTAL; i++) {
      const col = i % 4, row = Math.floor(i / 4);
      const x = 520 + 55 + col * 110, y = 112 + 48 + row * 96;
      const id = S.sel[i];
      if (id) {
        const p = PLACES.find(q => q.id === id);
        stamp(c, x + (((i * 37) % 11) - 5), y + (((i * 53) % 9) - 4), p, i, date);
      } else {
        c.save(); c.setLineDash([4, 5]); c.strokeStyle = GREEN; c.globalAlpha = .22; c.lineWidth = 1.2;
        c.beginPath(); c.arc(x, y, 38, 0, 7); c.stroke(); c.restore();
      }
    }
    c.fillStyle = '#7a8a80'; c.font = `500 11px ${FONT}`; c.textAlign = 'right'; c.fillText('BD Trip · Explore Bangladesh', 960, 606);
    c.restore();
  }

  /* ---------- render ---------- */
  const cv = $('#cv'), ctx = cv.getContext('2d'), SC = 1.5;
  function render() {
    const isCover = S.tab === 'cover', w = isCover ? 560 : 1000, h = isCover ? 780 : 640;
    cv.width = w * SC; cv.height = h * SC;
    ctx.setTransform(SC, 0, 0, SC, 0, 0);
    ctx.clearRect(0, 0, w, h);
    (isCover ? drawCover : drawInner)(ctx);
    $('#stage').classList.toggle('cover', isCover);
    const n = S.sel.length, t = T[S.lang];
    $('#badge').textContent = `${num(n)}/${num(TOTAL)} ${t.place}`;
    $('#cnt').textContent = `${num(n)}/${num(TOTAL)}`;
    $('#bar').style.width = (n / TOTAL * 100) + '%';
    $('#lvl').innerHTML = `${t.lvl}: <b>${S.lang === 'bn' ? levelOf(n)[1] : levelOf(n)[2]}</b>`;
    $('#left').textContent = t.left(TOTAL - n);
    $('#dl').disabled = false;
  }

  function renderPlaces() {
    const list = $('#list'); list.innerHTML = '';
    PLACES.forEach(p => {
      const on = S.sel.includes(p.id), b = document.createElement('button');
      b.type = 'button'; b.className = 'place' + (on ? ' on' : '');
      b.setAttribute('role', 'checkbox'); b.setAttribute('aria-checked', on);
      b.innerHTML = `<i class="ck"></i><span><b>${S.lang === 'bn' ? p.bn : p.en}</b><small>${S.lang === 'bn' ? p.dbn : p.den}</small></span>`;
      b.onclick = () => { S.sel = on ? S.sel.filter(x => x !== p.id) : [...S.sel, p.id]; save(); renderPlaces(); render(); };
      list.appendChild(b);
    });
  }

  function renderCovers() {
    const box = $('#covers'); box.innerHTML = '';
    Object.entries(COVERS).forEach(([k, v]) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'cv' + (S.cover === k ? ' on' : '');
      b.innerHTML = `<span style="background:${v.c}"></span>${v[S.lang]}`;
      b.onclick = () => { S.cover = k; save(); renderCovers(); render(); };
      box.appendChild(b);
    });
  }

  function applyLang() {
    document.documentElement.lang = S.lang;
    document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = T[S.lang][e.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = T[S.lang][e.dataset.i18nPh]; });
    $('#lang').textContent = S.lang === 'bn' ? 'English' : 'বাংলা';
    renderPlaces(); renderCovers(); render();
  }

  /* ---------- export ---------- */
  function composite() {
    const k = 1.5, c = document.createElement('canvas'); c.width = 1700 * k; c.height = 870 * k;
    const x = c.getContext('2d'); x.setTransform(k, 0, 0, k, 0, 0);
    const g = x.createLinearGradient(0, 0, 1700, 870); g.addColorStop(0, '#eef6f1'); g.addColorStop(1, '#f7f2e2');
    x.fillStyle = g; x.fillRect(0, 0, 1700, 870);
    const shadow = (px, py, w, h, r) => {
      x.save(); x.shadowColor = 'rgba(11,42,30,.35)'; x.shadowBlur = 34; x.shadowOffsetY = 14;
      rr(x, px, py, w, h, r); x.fillStyle = '#fff'; x.fill(); x.restore();
    };
    shadow(60, 40, 560, 780, 28); x.save(); x.translate(60, 40); drawCover(x); x.restore();
    shadow(660, 110, 1000, 640, 22); x.save(); x.translate(660, 110); drawInner(x); x.restore();
    x.fillStyle = GREEN; x.font = `700 16px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('BD Trip · Explore Bangladesh', 850, 848);
    return c;
  }
  const blobOf = c => new Promise(r => c.toBlob(r, 'image/png'));
  const fileName = () => 'bdtrip-passport' + (S.name.trim() ? '-' + S.name.trim().replace(/[^\w\u0980-\u09FF]+/g, '-') : '') + '.png';

  $('#dl').onclick = async () => {
    const b = await blobOf(composite()), a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  if (navigator.share) {
    const sh = $('#share'); sh.hidden = false;
    sh.onclick = async () => {
      try {
        const b = await blobOf(composite()), f = new File([b], fileName(), { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: 'BD Trip Passport' });
        else await navigator.share({ title: 'BD Trip Passport', url: location.href });
      } catch (e) {}
    };
  }

  /* ---------- events ---------- */
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    S.tab = b.dataset.tab; save();
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); render();
  });
  $('#all').onclick = () => { S.sel = PLACES.map(p => p.id); save(); renderPlaces(); render(); };
  $('#none').onclick = () => { S.sel = []; save(); renderPlaces(); render(); };
  $('#lang').onclick = () => { S.lang = S.lang === 'bn' ? 'en' : 'bn'; save(); applyLang(); };
  let raf; $('#name').addEventListener('input', e => { S.name = e.target.value; save(); cancelAnimationFrame(raf); raf = requestAnimationFrame(render); });

  $('#name').value = S.name;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === S.tab));
  applyLang();
  const loads = ['400', '500', '600', '700'].map(w => document.fonts.load(`${w} 16px "Hind Siliguri"`, 'অআকখ ABC'));
  Promise.all(loads).then(render).catch(() => {});
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
