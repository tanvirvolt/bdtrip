<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BDTrip — ট্রিপ বাজেট ও প্ল্যানার</title>
<meta name="description" content="বাংলাদেশের জনপ্রিয় গন্তব্যের ভ্রমণ বাজেট, যাতায়াত, দিনভিত্তিক প্ল্যান, প্যাকিং ও নিরাপত্তা গাইড।">
<link rel="canonical" href="https://bdtrip.vercel.app/budget/">
<link rel="stylesheet" href="/style.css">\n<link rel="stylesheet" href="/navbar.css">
<link rel="stylesheet" href="/design-tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky tab strip, budget wizard drawn as a five-stop route, live total docked at the bottom on the budget tab */
:root{
  --bg:#EDF2EE; --surface:#FFFFFF; --surface2:#F3F7F4; --ink:#0F2419; --muted:#53695D; --line:#D2DDD5;
  --brand:#0E5A3F; --brand-ink:#FFFFFF; --accent:#F0B03A; --accent-ink:#2A1D00;
  --good:#1E7A4F; --good-bg:#E1F2E8; --warn:#8A5A00; --warn-bg:#FBF0D6; --bad:#B63425; --bad-bg:#FBE8E4;
  --c1:#2C7CB8; --c2:#0E8A5F; --c3:#DE8420; --c4:#8059C4; --c5:#76897F;
  --font-display:'Anek Bangla','Hind Siliguri',system-ui,sans-serif;
  --font-body:'Hind Siliguri','Anek Bangla',system-ui,sans-serif;
}
body.dark{
  --bg:#0B1612; --surface:#12231C; --surface2:#172B23; --ink:#E7F1EB; --muted:#9DB4A8; --line:#25392F;
  --brand:#53C493; --brand-ink:#052015; --accent:#F2B33D; --accent-ink:#2A1D00;
  --good:#5ED197; --good-bg:#15301F; --warn:#E8B04A; --warn-bg:#3A2D10; --bad:#FF8A78; --bad-bg:#3A1C18;
  --c1:#5DA8E0; --c2:#4DC594; --c3:#F0A049; --c4:#A98BE6; --c5:#8FA498; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;padding-inline:0;padding-block:0 28px}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{width:min(1240px,calc(100% - 40px));max-width:1240px;margin-inline:auto}
.has-live .wrap{padding-bottom:140px}
.has-live #app{padding-bottom:110px}
.has-live .budget-footer{margin-bottom:125px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-block:12px 8px}
.app-langrow{display:flex;justify-content:flex-end;padding-top:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:none;width:38px;height:38px;border-radius:11px;background:var(--brand);position:relative}
.mark::before{content:"";position:absolute;left:9px;right:9px;top:18px;border-top:2.5px dashed var(--brand-ink);opacity:.85}
.mark::after{content:"";position:absolute;right:7px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.brand h1{font-size:23px;font-weight:800;letter-spacing:-.01em}
.brand p{font-size:13px;color:var(--muted);line-height:1.35}
.lang{display:flex;flex:none;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--brand);color:var(--brand-ink)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;overflow-x:auto;background:var(--bg);padding-block:8px;margin-bottom:12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:9px 15px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--bg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.sec-h{font-size:19px;font-weight:700;margin-bottom:4px}
.lead{color:var(--muted);font-size:14.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row + .row{margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr}}

.route{display:flex;list-style:none;margin:2px 0 14px;padding:0}
.route li{flex:1;position:relative;text-align:center;min-width:0}
.route li::before{content:"";position:absolute;top:16px;left:-50%;width:100%;border-top:2px dashed var(--line)}
.route li:first-child::before{display:none}
.route li.done::before,.route li.on::before{border-top-style:solid;border-top-color:var(--brand)}
.stop{position:relative;z-index:1;width:33px;height:33px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--muted)}
.route li.done .stop{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.route li.on .stop{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 20%,transparent)}
.route span{display:block;font-size:12px;line-height:1.25;margin-top:5px;color:var(--muted);padding-inline:2px}
.route li.on span{color:var(--ink);font-weight:600}

.opt{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;background:var(--surface2);border:1.5px solid var(--line);border-radius:13px;padding:12px 13px}
.opt b{font-family:var(--font-display);font-size:16px}
.opt small{color:var(--muted);font-size:13px;line-height:1.35}
.opt .pr{font-weight:600;font-size:14px;color:var(--brand)}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 11%,var(--surface))}
.opt.dim{opacity:.55}

.stp{display:flex;align-items:center;gap:6px}
.stp button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface2);font-size:20px;line-height:1;font-weight:600}
.stp button:disabled{opacity:.35;cursor:default}
.stp b{min-width:34px;text-align:center;font-size:18px;font-family:var(--font-display)}
.tog{position:relative;flex:none;width:48px;height:28px;border-radius:999px;border:0;background:var(--line);transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.tog[aria-checked="true"]{background:var(--brand)}
.tog[aria-checked="true"]::after{transform:translateX(20px)}
.lbl{font-weight:600}
.lbl small{display:block;font-weight:400;color:var(--muted);font-size:13px}

.field{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface2);border-radius:11px;padding:0 12px;min-height:42px}
.field span{color:var(--muted)}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:0;padding:9px 0;font-size:16px}
.field select{padding-inline:0}
.field:focus-within{border-color:var(--brand)}

.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px;min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
a.lnk{color:var(--brand);font-weight:600}

.note{border-radius:12px;padding:10px 13px;font-size:14px;line-height:1.45;background:var(--surface2);border:1px solid var(--line)}
.note.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.note.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.note.good{background:var(--good-bg);color:var(--good);border-color:transparent}

.live{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(7,30,20,.08);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));min-height:84px}
.live .in{width:min(1240px,calc(100% - 40px));max-width:1240px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.live small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.live b{font-family:var(--font-display);font-size:24px;line-height:1.1}

.hero-total{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1.05;letter-spacing:-.02em;background:linear-gradient(transparent 68%,color-mix(in srgb,var(--accent) 60%,transparent) 68%);display:inline-block}
.stackbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin-block:14px 10px}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:7px}
.legend div{display:grid;grid-template-columns:12px 1fr auto auto;gap:9px;align-items:center;font-size:15px}
.legend em{font-style:normal;color:var(--muted);font-size:13px;min-width:38px;text-align:right}
.dot{width:12px;height:12px;border-radius:3px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--surface2);border-radius:12px;padding:10px 12px}
.kv small{display:block;color:var(--muted);font-size:12.5px}
.kv b{font-family:var(--font-display);font-size:20px}
.cmp{display:grid;grid-template-columns:minmax(78px,110px) 1fr auto;gap:10px;align-items:center;font-size:14.5px}
.cmp .tr{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.cmp .tr i{display:block;height:100%;background:var(--c5);border-radius:6px}
.cmp.me .tr i{background:var(--brand)}
.cmp.me{font-weight:600}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--bad-bg);color:var(--bad);margin-left:4px}

.mode{display:flex;flex-direction:column;gap:6px}
.mode .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.mode .h b{font-family:var(--font-display);font-size:17px}
.mode .pr{font-weight:600;color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:600;font-size:14.5px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

.day h3{font-size:18px}
.day .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.day .dn{font-size:13px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
.slot{display:grid;grid-template-columns:62px 1fr;gap:10px;padding-block:8px;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.slot span{font-size:13px;font-weight:600;color:var(--muted)}

.check{display:flex;gap:11px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--brand);transition:width .2s}
.helpline{display:flex;align-items:center;gap:12px}
.helpline b{font-family:var(--font-display);font-size:26px;min-width:64px;color:var(--bad)}
ul.pl{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:90vw}
textarea.share{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface2);padding:10px}
footer{margin-top:22px;font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Wider planner canvas and a clean, lightweight footer */
.budget-footer{width:min(1240px,calc(100% - 40px));margin:40px auto 0;color:var(--muted);text-align:left;font-size:14px}
.budget-footer-inner{border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:22px 26px 14px;box-shadow:0 8px 26px rgba(7,30,20,.04)}
.budget-footer-brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.budget-footer-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-size:24px;font-weight:800}
.budget-footer-brand b{display:block;font-size:19px;line-height:1.1}.budget-footer-brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.budget-footer-links{display:flex;flex-wrap:wrap;gap:10px 22px;padding:18px 0;margin-top:14px;border-top:1px solid var(--line)}
.budget-footer-links a,.budget-footer-bottom a{color:var(--muted);text-decoration:none}.budget-footer-links a:hover,.budget-footer-bottom a:hover{color:var(--brand)}
.budget-footer-bottom{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:13px;font-size:12px}
body.dark .budget-footer-inner{background:var(--surface);border-color:var(--line);box-shadow:none}
@media(max-width:600px){.has-live .wrap{padding-bottom:160px}.has-live #app{padding-bottom:130px}.has-live .budget-footer{margin-bottom:140px}.live{padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));min-height:78px}.budget-footer{width:calc(100% - 28px);margin-top:28px}.budget-footer-inner{padding:18px 16px 13px;border-radius:16px}.budget-footer-links{gap:10px 16px}.budget-footer-bottom{align-items:flex-start;flex-direction:column}}


/* Responsive polish: fluid spacing, clearer focus and touch-friendly controls */
:root{--page-gutter:clamp(14px,3vw,28px);--card-radius:clamp(13px,1.6vw,18px);--section-gap:clamp(12px,2vw,18px)}
.wrap{width:min(1240px,calc(100% - 2 * var(--page-gutter)))}
.card{border-radius:var(--card-radius);padding:clamp(14px,2vw,22px);transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease}
.opt,.btn,.tab,.stop,.field,.stp button{transition:background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}
.opt:hover{border-color:color-mix(in srgb,var(--brand) 50%,var(--line));transform:translateY(-1px)}
.btn:hover:not(:disabled){border-color:var(--brand);transform:translateY(-1px)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 5px 16px color-mix(in srgb,var(--brand) 22%,transparent)}
.tab:hover{background:var(--surface2);color:var(--ink)}
.tab.on:hover{background:var(--ink);color:var(--bg)}
.grid2,.grid3,.kv{min-width:0}
.grid2>* ,.grid3>* ,.kv>*{min-width:0}
.field input,.field select{width:100%}
button:disabled{opacity:.45;cursor:not-allowed}
.live{padding-left:max(12px,var(--page-gutter));padding-right:max(12px,var(--page-gutter));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--surface) 94%,transparent)}
.live .in{width:100%;max-width:1240px}
.budget-footer{width:min(1240px,calc(100% - 2 * var(--page-gutter)))}
@media(min-width:1500px){.wrap,.live .in,.budget-footer{max-width:1320px}}
@media(max-width:760px){
  .wrap{width:calc(100% - 28px)}
  .live .in{width:100%}
  .app-subnav{align-items:center;gap:8px}
  .app-subnav .tabs{flex-wrap:nowrap;overscroll-behavior-x:contain}
  .app-subnav .tab{padding-inline:clamp(8px,2.2vw,13px)}
}
@media(max-width:520px){
  .wrap{width:calc(100% - 24px)}
  .app-subnav{align-items:flex-start;flex-direction:column-reverse;gap:6px;padding-bottom:7px}
  .app-subnav .app-langrow{align-self:flex-end}
  .app-subnav .tabs{width:100%;margin:0}
  .grid2,.kv{grid-template-columns:1fr}
  .card{padding:14px}
  .live{min-height:76px;padding-top:9px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .live b{font-size:clamp(20px,6vw,24px)}
  .live .btn{min-height:42px;padding:8px 12px;white-space:nowrap}
  .hero-total{font-size:clamp(32px,9vw,44px)}
  .budget-footer{width:calc(100% - 24px)}
}
@media(hover:none){.opt:hover,.btn:hover:not(:disabled){transform:none;box-shadow:none}}
@media(prefers-reduced-motion:reduce){.card,.opt,.btn,.tab,.stop,.field,.stp button{transition:none!important}}

/* Align planner tabs and language control with the calculator container */
.app-subnav{
  width:min(1240px,calc(100% - 2 * var(--page-gutter)));
  max-width:1320px;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  min-width:0;
  border-bottom:1px solid var(--line);
}
.app-subnav .tabs{
  position:static;
  flex:1 1 auto;
  min-width:0;
  margin:0;
  border-bottom:0;
}
.app-subnav .app-langrow{flex:0 0 auto;padding:0;margin:0}
.app-subnav .lang{white-space:nowrap}
@media(min-width:1500px){
  .app-subnav{width:min(1320px,calc(100% - 2 * var(--page-gutter)))}
}
@media(max-width:760px){
  .app-subnav{width:calc(100% - 28px);gap:8px}
  .app-subnav .tabs{width:auto;flex:1}
}
@media(max-width:520px){
  .app-subnav{width:calc(100% - 24px);align-items:flex-start;flex-direction:column-reverse;gap:6px;padding-bottom:7px}
  .app-subnav .app-langrow{align-self:flex-end}
  .app-subnav .tabs{width:100%;flex:none}
}

/* Full-width planner layout: align tabs, calculator and footer; keep global navbar untouched */
:root{--planner-gutter:clamp(14px,2.4vw,36px)}
.wrap{
  width:calc(100% - 2 * var(--planner-gutter));
  max-width:1440px;
  margin-inline:auto;
}
.app-subnav{
  width:calc(100% - 2 * var(--planner-gutter));
  max-width:1440px;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  min-width:0;
  border-bottom:1px solid var(--line);
}
.app-subnav .tabs{
  position:static;
  flex:1 1 auto;
  min-width:0;
  margin:0;
  border-bottom:0;
}
.app-subnav .app-langrow{flex:0 0 auto;padding:0;margin:0}
.app-subnav .lang{white-space:nowrap}
.live .in{
  width:calc(100% - 2 * var(--planner-gutter));
  max-width:1440px;
}
.budget-footer{
  width:calc(100% - 2 * var(--planner-gutter));
  max-width:1440px;
}
@media(min-width:1700px){
  .wrap,.app-subnav,.live .in,.budget-footer{max-width:1520px}
}
@media(max-width:760px){
  .wrap,.app-subnav,.budget-footer{width:calc(100% - 28px)}
  .live .in{width:100%}
  .app-subnav{gap:8px}
  .app-subnav .tabs{width:auto;flex:1}
}
@media(max-width:520px){
  .wrap,.app-subnav,.budget-footer{width:calc(100% - 24px)}
  .app-subnav{align-items:flex-start;flex-direction:column-reverse;gap:6px;padding-bottom:7px}
  .app-subnav .app-langrow{align-self:flex-end}
  .app-subnav .tabs{width:100%;flex:none}
}

/* Final full-page width override — all planner sections share the viewport width */
body .wrap#app{
  width:calc(100% - 40px);
  max-width:none;
  margin-left:auto;
  margin-right:auto;
}
body .app-subnav{
  width:calc(100% - 40px);
  max-width:none;
  margin-left:auto;
  margin-right:auto;
}
body .live .in{
  width:calc(100% - 40px);
  max-width:none;
  margin-left:auto;

function tog(k,on,label,sub){return '<div class="row"><div class="lbl">'+label+(sub?'<small>'+sub+'</small>':'')+'</div><button class="tog" role="switch" aria-checked="'+(!!on)+'" aria-label="'+esc(label)+'" data-act="tog" data-k="'+k+'"></button></div>'}
function stepper(k,val,min,max,label,sub){return '<div class="row"><div class="lbl">'+label+(sub?'<small>'+sub+'</small>':'')+'</div><div class="stp"><button data-act="dec" data-k="'+k+'" aria-label="-" '+(val<=min?'disabled':'')+'>−</button><b class="num">'+N(val)+'</b><button data-act="inc" data-k="'+k+'" aria-label="+" '+(val>=max?'disabled':'')+'>+</button></div></div>'}
function numField(k,val,pre,label){return '<label class="stack" style="gap:6px"><span class="lbl small">'+label+'</span><span class="field"><span>'+pre+'</span><input type="number" inputmode="numeric" min="0" id="f-'+k+'" data-in="'+k+'" value="'+(val==null?'':Math.round(val))+'"></span></label>'}
function destChips(){return '<div class="chips" role="group">'+DEST_IDS.map(function(id){return '<button class="chip'+(S.dest===id?' on':'')+'" data-act="dest" data-v="'+id+'">'+Lg(DEST[id].n)+'</button>'}).join('')+'</div>'}
function seasonNote(d){
  var out='';
  if(d.closed.indexOf(S.month)>-1)out+='<div class="note bad">'+T('এই মাসে '+Lg(d.n)+' সাধারণত যাওয়া যায় না বা পরিষেবা বন্ধ থাকে। অন্য মাস দেখুন।',Lg(d.n)+' is usually closed or hard to reach in this month. Try another month.')+'</div>';
  else if(isPeak(d,S.month)||S.eid)out+='<div class="note warn">'+T('ভিড়ের মৌসুম। হোটেল ভাড়া প্রায় '+N((d.peakHotel-1)*100)+'% ও যাতায়াত প্রায় ১৫% বেশি ধরা হয়েছে।','Peak season. Hotels are priced about '+N((d.peakHotel-1)*100)+'% higher and transport about 15% higher.')+'</div>';
  return out;
}

/* ---------- Budget wizard ---------- */
var STEPS=[['ট্রিপ','Trip'],['যাতায়াত','Transport'],['হোটেল','Hotel'],['খাবার','Food'],['গাইড ও আরও','Guide & more']];
function routeHtml(){return '<ol class="route">'+STEPS.map(function(s,i){return '<li class="'+(i<step?'done':i===step?'on':'')+'"><button class="stop" data-act="step" data-v="'+i+'" aria-label="'+esc(Lg(s))+'"'+(i===step?' aria-current="step"':'')+'>'+N(i+1)+'</button><span>'+Lg(s)+'</span></li>'}).join('')+'</ol>'}
function navHtml(){return '<div class="nav"><button class="btn ghost" data-act="back" '+(step===0?'disabled style="opacity:.4"':'')+'>← '+T('আগের','Back')+'</button><button class="btn primary" data-act="next">'+(step===4?T('হিসাব দেখো','See my budget'):T('পরের ধাপ','Next')+' →')+'</button></div>'}
function tierCards(d,key,sel,names,descs,vals){return '<div class="grid3">'+names.map(function(n,i){return '<button class="opt'+(sel===i?' sel':'')+'" data-act="'+key+'" data-v="'+i+'"><b>'+Lg(n)+'</b><small>'+Lg(descs[i])+'</small><span class="pr num">'+TK(vals[i])+'</span></button>'}).join('')+'</div>'}

  var d=DEST[S.dest],r=calc(S),h='';

    h+='<div class="stack" style="margin-top:16px;gap:0">'+stepper('adults',S.adults,1,20,T('প্রাপ্তবয়স্ক','Adults'))+stepper('kids',S.kids,0,10,T('শিশু','Children'),T('খরচ অর্ধেক ধরা হয়','Counted at half cost'))+stepper('days',S.days,1,10,T('কত দিন','Days'),T(N(Math.max(S.days-1,0))+' রাত',N(Math.max(S.days-1,0))+' night(s)'))+'</div>';
    h+='<div class="stack" style="margin-top:16px"><label class="stack" style="gap:6px"><span class="lbl small">'+T('কোন মাসে যাবেন','Month of travel')+'</span><span class="field"><select id="f-month" data-ch="month">'+MONTHS.map(function(m,i){return '<option value="'+i+'"'+(S.month===i?' selected':'')+'>'+Lg(m)+'</option>'}).join('')+'</select></span></label>'+tog('eid',S.eid,T('ঈদ বা সরকারি ছুটি','Eid or public holiday'),T('দাম বেড়ে যায়','Prices rise'))+seasonNote(d)+'<div class="small muted">'+T('সেরা সময়: ','Best time: ')+Lg(d.best)+'</div></div>';
  }
  if(step===1){
    h+='<h2 class="sec-h">'+T('ঢাকা থেকে '+Lg(d.n)+' কীভাবে যাবেন?','How to get to '+Lg(d.n)+' from Dhaka')+'</h2><p class="lead">'+T('জনপ্রতি এক পথের ভাড়া। নিজের জানা ভাড়া লিখে বদলাতে পারেন।','Fare per person, one way. Type your own fare if you know it.')+'</p><div class="stack" style="margin-top:12px">';
    d.modes.forEach(function(m){h+='<button class="opt mode'+(r.m.id===m.id?' sel':'')+'" data-act="mode" data-v="'+m.id+'"><span class="h"><b>'+Lg(MODE[m.id])+'</b><span class="pr num">'+TK(m.fare)+'</span></span><small>'+Lg(m.h)+'</small></button>'});
    h+='</div><div class="note" style="margin-top:12px">'+Lg(r.m.i)+'</div><div class="stack" style="margin-top:14px">'+numField('fare',r.fare,'৳',T('জনপ্রতি এক পথের ভাড়া','Fare per person, one way'))+tog('round',S.round,T('যাওয়া-আসা দুই পথ','Return trip'))+(d.fixedPP?'<div class="note">'+Lg(d.fixedN)+': <b class="num">'+TK(d.fixedPP)+'</b> '+T('জনপ্রতি, হিসাবে যোগ করা হয়েছে।','per person, already included.')+'</div>':'')+tog('localOn',S.localOn,T('গন্তব্যে স্থানীয় যাতায়াত','Local transport there'),Lg(d.locI))+(S.localOn?numField('local',S.ov.local!=null?S.ov.local:d.local,'৳',T('দিনে পুরো দলের জন্য','Per day for the whole group')):'')+'</div>';
  }
  if(step===2){
    var base=[d.hotel[0],d.hotel[1],d.hotel[2]].map(function(x){return x*(r.peak?d.peakHotel:1)});
    h+='<h2 class="sec-h">'+T('কেমন হোটেলে থাকবেন?','What kind of stay?')+'</h2><p class="lead">'+T('প্রতি রুম, প্রতি রাতের ভাড়া।','Price per room, per night.')+'</p><div style="margin-top:12px">'+tierCards(d,'hotel',S.hotelTier,[['সাশ্রয়ী','Economy'],['মাঝারি','Mid-range'],['প্রিমিয়াম','Premium']],[['সাধারণ রুম, ফ্যান বা এসি','Basic room, fan or AC'],['এসি, নাস্তা সহ, ভালো লোকেশন','AC, breakfast, good location'],['রিসোর্ট বা ভিউ রুম','Resort or view room']],base)+'</div><div class="stack" style="margin-top:14px">'+numField('hotel',r.rate,'৳',T('আপনার রুম ভাড়া (প্রতি রাত)','Your room rate (per night)'))+stepper('rooms',r.rooms,1,15,T('রুম','Rooms'),T('আপনার দলের জন্য আমরা '+N(Math.max(1,Math.ceil(r.pf/2)))+'টি রুম ধরেছি','We suggest '+N(Math.max(1,Math.ceil(r.pf/2)))+' room(s) for your group'))+'<div class="small muted">'+T(N(r.nights)+' রাতের জন্য হোটেল ধরা হয়েছে।','Hotel counted for '+N(r.nights)+' night(s).')+'</div></div>';
  }
  if(step===3){
    h+='<h2 class="sec-h">'+T('খাবারে কত খরচ করবেন?','How will you eat?')+'</h2><p class="lead">'+T('জনপ্রতি প্রতি বেলার গড়।','Average per person, per meal.')+'</p><div style="margin-top:12px">'+tierCards(d,'foodTier',S.foodTier,[['সাশ্রয়ী','Street food'],['সাধারণ রেস্টুরেন্ট','Restaurant'],['প্রিমিয়াম','Premium']],[['ভর্তা-ভাত, নাস্তা, স্ট্রিট ফুড','Rice meals, snacks, street food'],['ভাত-মাছ-মাংস, ভালো রেস্টুরেন্ট','Rice, fish, curry in a good restaurant'],['সি-ফুড, বুফে, হোটেল ডাইনিং','Seafood, buffets, hotel dining']],d.food)+'</div><div class="stack" style="margin-top:14px"><div><div class="lbl small" style="margin-bottom:6px">'+T('দিনে কত বেলা বাইরে খাবেন','Meals out per day')+'</div><div class="chips">'+[2,3,4].map(function(n){return '<button class="chip'+(S.meals===n?' on':'')+'" data-act="meals" data-v="'+n+'">'+N(n)+T(' বেলা',' meals')+'</button>'}).join('')+'</div></div>'+numField('food',S.ov.food!=null?S.ov.food:d.food[S.foodTier],'৳',T('আপনার গড় (জনপ্রতি, প্রতি বেলা)','Your average (per person, per meal)'))+'</div>';
  }
  if(step===4){
    h+='<h2 class="sec-h">'+T('ঘোরাঘুরি, গাইড ও অন্যান্য','Activities, guide and other')+'</h2><p class="lead">'+T('জনপ্রতি প্রতিদিনের ঘোরাঘুরির খরচ।','Per person, per day.')+'</p><div style="margin-top:12px">'+tierCards(d,'actTier',S.actTier,[['কম','Light'],['মাঝারি','Standard'],['বেশি','Full']],[['বিনামূল্যের জায়গা, হাঁটা','Free spots and walks'],['নৌকা, এন্ট্রি ফি, কিছু রাইড','Boat rides, entry fees, a few rides'],['ট্যুর, ওয়াটার স্পোর্টস, ফটোশুট','Tours, water sports, photoshoots']],d.act)+'</div><div class="stack" style="margin-top:14px">'+tog('guide',S.guide,T('গাইড নেবেন','Hire a guide'),d.guide?T('দিনে পুরো দলের জন্য আনুমানিক ','About ')+TK(d.guide)+T('','')+T('',' per day for the group'):T('সাধারণত দরকার হয় না, চাইলে যোগ করুন','Usually optional, add if you want one'))+(S.guide?numField('guide',S.ov.guide!=null?S.ov.guide:(d.guide||1000),'৳',T('গাইডের ভাড়া (প্রতিদিন, পুরো দল)','Guide fee (per day, whole group)')):'')+(d.permit?'<div class="note">'+T('এন্ট্রি ও পারমিট বাবদ জনপ্রতি '+TK(d.permit)+' ধরা হয়েছে।','Entry and permit fees of '+TK(d.permit)+' per person are included.')+'</div>':'')+numField('other',S.other,'৳',T('অন্যান্য খরচ (কেনাকাটা, বকশিশ)','Other costs (shopping, tips)'))+tog('buffer',S.buffer,T('১০% জরুরি বাফার','10% emergency buffer'),T('দাম বাড়লে বা হঠাৎ খরচে কাজে লাগে','Covers price rises and surprises'))+numField('budget',S.budget||'','৳',T('আপনার বাজেট সীমা (ঐচ্ছিক)','Your budget limit (optional)'))+'</div>';
  }
  return h+navHtml();
}
function liveHtml(){var r=calc(S);return '<div class="live"><div class="in"><div><small>'+T('আনুমানিক মোট','Estimated total')+'</small><b class="num" id="lv-total">'+TK(r.total)+'</b><small id="lv-head">'+T('জনপ্রতি ','Per head ')+TK(r.perHead)+'</small></div><button class="btn primary" data-act="result">'+T('বিস্তারিত','Details')+'</button></div></div>'}

/* ---------- Result ---------- */
function savings(){
  var base=calc(S).total,out=[],d=DEST[S.dest];
  var add=function(label,v){var x=base-calc(v).total;if(x>50)out.push({t:label,v:x})};
  if(S.hotelTier>0)add(T('একধাপ সাশ্রয়ী হোটেল','One tier cheaper hotel'),variant({hotelTier:S.hotelTier-1},['hotel']));
  if(S.foodTier>0)add(T('একধাপ সাশ্রয়ী খাবার','One tier cheaper food'),variant({foodTier:S.foodTier-1},['food']));
  if(S.actTier>0)add(T('ঘোরাঘুরি কমানো','Fewer paid activities'),variant({actTier:S.actTier-1}));
  var cheap=d.modes.slice().sort(function(a,b){return a.fare-b.fare})[0];
  if(cheap.id!==S.mode)add(T(Lg(MODE[cheap.id])+' এ যাওয়া','Travel by '+Lg(MODE[cheap.id])),variant({mode:cheap.id},['fare']));
  if(S.days>2)add(T('এক দিন কম','One day shorter'),variant({days:S.days-1}));
  if(S.guide)add(T('গাইড ছাড়া','Go without a guide'),variant({guide:false}));
  return out.sort(function(a,b){return b.v-a.v}).slice(0,3);
}
function summaryText(){
  var d=DEST[S.dest],r=calc(S);
  var l=['BD Trip: '+Lg(d.n)+', '+N(S.days)+T(' দিন',' days'),T('মোট ','Group: ')+N(r.heads)+T(' জন (',' people (')+N(S.adults)+T(' প্রাপ্তবয়স্ক, ',' adults, ')+N(S.kids)+T(' শিশু)',' children)'),''];
  CATS.forEach(function(c){l.push(Lg(c[1])+': '+TK(r.cats[c[0]]))});
  if(r.buf)l.push(T('বাফার ১০%: ','10% buffer: ')+TK(r.buf));
  l.push('','• '+T('মোট: ','Total: ')+TK(r.total)+' ('+TK(r.min)+' – '+TK(r.max)+')','• '+T('জনপ্রতি: ','Per head: ')+TK(r.perHead));
  return l.join('\n');
}
function splitData(){
  var r=calc(S),n=S.split.n||S.adults,per=Math.ceil(r.total/n/10)*10;
  if(!S.split.custom)return {n:n,per:per,paid:per*n,r:r};
  var amts=[];for(var i=0;i<n;i++)amts.push(Number(S.split.amts[i])||0);
  return {n:n,per:per,paid:amts.reduce(function(a,b){return a+b},0),r:r,amts:amts};
}
function resultHtml(){
  var d=DEST[S.dest],r=calc(S),h='';
  h+='<div class="stack"><div class="card"><div class="small muted">'+Lg(d.n)+' · '+N(S.days)+T(' দিন · ',' days · ')+N(r.heads)+T(' জন',' people')+'</div><div style="margin-top:8px"><span class="hero-total num">'+TK(r.total)+'</span></div><div class="muted small" style="margin-top:8px">'+T('সম্ভাব্য সীমা: ','Likely range: ')+TK(r.min)+' – '+TK(r.max)+'</div>';
  h+='<div class="stackbar" role="img" aria-label="'+esc(T('খরচের ভাগ','Cost breakdown'))+'">'+CATS.map(function(c){var p=r.cats[c[0]]/r.sub*100;return p>0?'<i style="width:'+p+'%;background:var('+c[2]+')"></i>':''}).join('')+'</div><div class="legend">'+CATS.map(function(c){var v=r.cats[c[0]];return '<div><span class="dot" style="background:var('+c[2]+')"></span><span>'+Lg(c[1])+'</span><b class="num">'+TK(v)+'</b><em class="num">'+N(v/r.sub*100)+'%</em></div>'}).join('')+'</div>'+(r.buf?'<div class="small muted" style="margin-top:10px">'+T('জরুরি বাফার ১০%: ','10% emergency buffer: ')+TK(r.buf)+T(' (মোটে যোগ করা)',' (included in total)')+'</div>':'')+'</div>';
  h+=seasonNote(d);
  h+='<div class="kv"><div><small>'+T('জনপ্রতি গড়','Average per head')+'</small><b class="num">'+TK(r.perHead)+'</b></div><div><small>'+T('প্রাপ্তবয়স্ক প্রতি (শিশুসহ)','Per adult (kids covered)')+'</small><b class="num">'+TK(r.perAdult)+'</b></div></div>';
  if(S.budget>0){var diff=S.budget-r.total;
    h+='<div class="note '+(diff>=0?'good':'bad')+'"><b>'+(diff>=0?T('বাজেটের মধ্যে আছে। ','Within budget. ')+T('বাকি ','Left: ')+TK(diff):T('বাজেটের চেয়ে ','Over budget by ')+TK(-diff)+T(' বেশি।',''))+'</b>'+(diff<0?'<ul class="pl">'+savings().map(function(s){return '<li>'+s.t+' → '+T('বাঁচবে ','saves ')+TK(s.v)+'</li>'}).join('')+'</ul>':'')+'</div>';
  } else {var sv=savings();if(sv.length)h+='<div class="note"><b>'+T('খরচ কমাতে চাইলে','To spend less')+'</b><ul class="pl">'+sv.map(function(s){return '<li>'+s.t+' → '+T('বাঁচবে ','saves ')+TK(s.v)+'</li>'}).join('')+'</ul></div>'}
  /* group split */
  var sp=splitData();
  h+='<div class="card"><h3 class="sec-h">'+T('গ্রুপে ভাগ করুন','Split between the group')+'</h3><p class="lead">'+T('যারা টাকা দেবেন তাদের সংখ্যা দিন। শিশুদের খরচ অভিভাবকদের ভাগে ধরা আছে।','Set how many people pay. Children\'s costs are covered by the adults.')+'</p><div style="margin-top:8px">'+stepper('splitN',sp.n,1,20,T('কতজন দেবেন','People paying'))+'</div>'+tog('splitCustom',S.split.custom,T('নিজের মতো ভাগ','Custom amounts'),T('কেউ বেশি বা কম দিলে','If some pay more or less'));
  if(!S.split.custom){h+='<div class="kv" style="margin-top:12px"><div><small>'+T('প্রত্যেকে দেবেন','Each pays')+'</small><b class="num">'+TK(sp.per)+'</b></div><div><small>'+T('মোট জমা','Collected')+'</small><b class="num">'+TK(sp.paid)+'</b></div></div>'}
  else{h+='<div class="stack" style="margin-top:12px;gap:8px">';for(var i=0;i<sp.n;i++){h+='<div class="row" style="flex-wrap:nowrap"><span class="field" style="flex:1;min-width:0"><input type="text" id="nm'+i+'" data-nm="'+i+'" placeholder="'+esc(T('নাম ','Name ')+N(i+1))+'" value="'+esc(S.split.names[i]||'')+'"></span><span class="field" style="width:130px;flex:none"><span>৳</span><input type="number" inputmode="numeric" min="0" id="am'+i+'" data-am="'+i+'" value="'+(S.split.amts[i]!=null&&S.split.amts[i]!==''?S.split.amts[i]:'')+'"></span></div>'}
    h+='<div class="row"><button class="btn sm" data-act="eqfill">'+T('সমান ভাগ বসাও','Fill equal shares')+'</button></div><div class="note" id="splitnote"></div></div>'}
  h+='</div>';
  /* compare */

/* ---------- Itinerary ---------- */
var SLOT={m:['সকাল','Morning'],a:['দুপুর','Afternoon'],e:['সন্ধ্যা','Evening']};
function genPlan(d,days){
  var C=d.plan,out=[],pick=function(c,s){return c.i.filter(function(x){return x.s===s})};
  if(days===1)return [{t:['ডে ট্রিপ','Day trip'],items:[P('m',d.arrive[0],d.arrive[1])].concat(pick(C[0],'m'),pick(C[0],'a'),[P('e',d.leave[0],d.leave[1])])}];
  out.push({t:C[0].t,items:[P('m',d.arrive[0],d.arrive[1])].concat(pick(C[0],'a'),pick(C[0],'e'))});
  for(var i=1;i<days-1;i++){
    if(i<C.length)out.push({t:C[i].t,items:C[i].i});
    else out.push({t:['মুক্ত দিন','Free day'],items:[P('m','দেরিতে ঘুম, নাস্তা','Late start, breakfast'),P('a','পছন্দের জায়গা আবার ঘোরা বা কেনাকাটা','Revisit favourites or shop'),P('e','হালকা ডিনার ও বিশ্রাম','Easy dinner and rest')]});
  }
  var li=days-1<C.length?days-1:0;
  out.push({t:['ফেরার দিন','Heading home'],items:pick(C[li],'m').concat([P('a',d.leave[0],d.leave[1])])});
  return out;
}
function planHtml(){

function render(keepScroll){
  var body={budget:budgetHtml,transport:transportHtml,plan:planHtml,pack:packHtml,safety:safetyHtml}[view]();

function splitNote(){

function setHash(v){try{history.replaceState(null,'','#'+v)}catch(e){}}

/* ---------- Events ---------- */
var LIM={adults:[1,20],kids:[0,10],days:[1,10]};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,v=el.dataset.v,k=el.dataset.k;
  if(a==='lang'){lang=v;LS.set('bdt.lang',lang);render(true);return}
  if(a==='tab'){view=v;setHash(v);render();return}
  if(a==='step'){step=+v;render();return}
  if(a==='next'){if(step<4){step++;render()}else{step=5;render()}return}
  if(a==='back'){if(step>0){step--;render()}return}
  if(a==='result'){step=5;render();return}
  if(a==='edit'){step=0;render();return}
  if(a==='tobudget'){view='budget';setHash('budget');step=5;render();return}
  if(a==='goplan'){view='plan';setHash('plan');render();return}
  if(a==='topack'){view='pack';setHash('pack');render();return}
  if(a==='dest'){S.dest=v;S.ov={};S.rooms=null;var dd=DEST[v];if(!dd.modes.some(function(m){return m.id===S.mode}))S.mode='bus';S.guide=false;save();render(true);return}
  if(a==='mode'){S.mode=v;delete S.ov.fare;save();render(true);return}
  if(a==='hotel'){S.hotelTier=+v;delete S.ov.hotel;save();render(true);return}
  if(a==='foodTier'){S.foodTier=+v;delete S.ov.food;save();render(true);return}
  if(a==='actTier'){S.actTier=+v;save();render(true);return}
  if(a==='meals'){S.meals=+v;save();render(true);return}
  if(a==='tog'&&k==='splitCustom'){S.split.custom=!S.split.custom;save();render(true);return}
  if(a==='tog'){S[k]=!S[k];if(k==='guide'&&!S.guide)delete S.ov.guide;if(k==='localOn'&&!S.localOn)delete S.ov.local;save();render(true);return}
  if(a==='inc'||a==='dec'){
    var dl=a==='inc'?1:-1;
    if(k==='rooms'){S.rooms=Math.min(15,Math.max(1,calc(S).rooms+dl))}
    else if(k==='splitN'){S.split.n=Math.min(20,Math.max(1,(S.split.n||S.adults)+dl))}
    else{var lm=LIM[k];S[k]=Math.min(lm[1],Math.max(lm[0],S[k]+dl));if(k==='adults'||k==='kids')S.rooms=null}
    save();render(true);return}
  if(a==='splitCustom'){S.split.custom=!S.split.custom;save();render(true);return}
  if(a==='eqfill'){var sp=splitData();S.split.amts=[];for(var i=0;i<sp.n;i++)S.split.amts.push(sp.per);save();render(true);return}
  if(a==='copy'){copyText(summaryText());return}
  if(a==='saveTrip'){var r=calc(S);saved.unshift({id:'t'+Date.now(),name:Lg(DEST[S.dest].n)+' · '+N(S.days)+T(' দিন',' days')+' · '+N(r.heads)+T(' জন',' people'),total:r.total,s:JSON.parse(JSON.stringify(S))});saved=saved.slice(0,10);LS.set('bdt.saved',saved);toast(T('ট্রিপ সেভ হয়েছে','Trip saved'));render(true);return}
  if(a==='loadTrip'){var f=saved.filter(function(x){return x.id===v})[0];if(f){S=Object.assign({},DEF,f.s);S.ov=Object.assign({},S.ov);S.split=Object.assign({},DEF.split,S.split);save();step=5;render()}return}
  if(a==='delTrip'){saved=saved.filter(function(x){return x.id!==v});LS.set('bdt.saved',saved);render(true);return}
  if(a==='addItem'){var inp=document.getElementById('newitem');if(inp&&inp.value.trim()){pack.custom.push({id:'c'+Date.now(),t:inp.value.trim()});LS.set('bdt.pack',pack);render(true)}return}
  if(a==='delItem'){e.preventDefault();pack.custom=pack.custom.filter(function(c){return c.id!==v});delete pack.checked[v];LS.set('bdt.pack',pack);render(true);return}
  if(a==='clearTicks'){pack.checked={};LS.set('bdt.pack',pack);render(true);return}
});
document.addEventListener('input',function(e){
  var t=e.target,k=t.dataset.in;
  if(k){var val=t.value===''?null:Math.max(0,Number(t.value));
    if(k==='other'){S.other=val||0}
    else if(k==='budget'){S.budget=val||0}
    else if(k==='rooms'){S.rooms=val}
    else{if(val==null)delete S.ov[k];else S.ov[k]=val}
    save();live();return}
  if(t.dataset.am!=null){S.split.amts[+t.dataset.am]=t.value===''?'':Number(t.value);save();splitNote();return}
  if(t.dataset.nm!=null){S.split.names[+t.dataset.nm]=t.value;save();return}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.ch==='month'){S.month=+t.value;save();render(true);return}
  if(t.dataset.pk){pack.checked[t.dataset.pk]=t.checked;LS.set('bdt.pack',pack);render(true)}
});
window.addEventListener('hashchange',function(){var h=(location.hash||'').replace('#','');if(TABS.some(function(t){return t[0]===h})&&h!==view){view=h;render()}});
render(true);
})();
</script>
</body>
</html>
