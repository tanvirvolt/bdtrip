<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDTrip — ট্রিপ বাজেট ক্যালকুলেটর</title><meta name="description" content="BDTrip ট্রিপ বাজেট ক্যালকুলেটর"><link rel="canonical" href="https://bdtrip.vercel.app/budget/"><link rel="icon" href="/api/favicon"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/v2.css"><style>body{background:var(--page,#f7f8f5)}.standalone{max-width:980px;margin:auto;padding:28px 18px 60px}.page-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.page-head .brand{display:flex;align-items:center;text-decoration:none}.page-head nav{display:flex;gap:10px;flex-wrap:wrap}.page-head nav a{padding:9px 13px;border-radius:10px;text-decoration:none}.hero-mini{padding:36px 0 24px}.hero-mini h1{font-size:clamp(32px,6vw,54px);margin:0 0 10px}.hero-mini p{max-width:680px}.budget.card{margin-top:18px}.back{color:inherit}</style></head><body><main class="standalone"><header class="page-head"><a class="brand" href="/"><span class="mark">📍</span><span class="wordmark">BD<b>Trip</b></span></a><nav><a href="/">হোম</a><a href="/planner/">প্ল্যানার</a><a href="/journal/">জার্নাল</a><a href="/checklist/">চেকলিস্ট</a></nav></header><section class="hero-mini"><a class="back" href="/">← BDTrip হোম</a><h1>ট্রিপ বাজেট ক্যালকুলেটর</h1><p>নিজের হিসাব বসান—মোট, জনপ্রতি ও দিনপ্রতি সম্ভাব্য খরচ একসাথে দেখুন।</p></section><section class="budget card"><div class="b-grid"><label>সদস্য সংখ্যা<input type="number" id="b_people" min="1" value="2"></label><label>কত দিনের ট্রিপ<input type="number" id="b_days" min="1" value="3"></label><label>রুম সংখ্যা<input type="number" id="b_rooms" min="0" value="1"></label><label>যাতায়াত (জনপ্রতি, যাওয়া-আসা) ৳<input type="number" id="b_travel" min="0" placeholder="যেমন: 1500"></label><label>হোটেল (রুম প্রতি, রাত প্রতি) ৳<input type="number" id="b_hotel" min="0" placeholder="যেমন: 2000"></label><label>খাবার (জনপ্রতি, দিন প্রতি) ৳<input type="number" id="b_food" min="0" placeholder="যেমন: 600"></label><label>লোকাল ট্রান্সপোর্ট ও টিকিট (মোট) ৳<input type="number" id="b_other" min="0" placeholder="যেমন: 1000"></label><label class="check wide"><input type="checkbox" id="b_buf" checked> জরুরি খরচের জন্য ১০% বাফার যোগ করুন</label></div><div class="b-out"><div><small>মোট খরচ</small><b id="o_total">৳০</b></div><div><small>জনপ্রতি</small><b id="o_pp">৳০</b></div><div><small>দিন প্রতি</small><b id="o_pd">৳০</b></div></div><p class="note">হোটেল রাত = দিন − ১। কোনো ডিফল্ট ভাড়া বা টিকিটের দাম ধরা হয়নি।</p></section></main><script src="/budget.js" defer></script></body></html>
